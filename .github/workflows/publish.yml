name: Publish ke PyPI

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag harus sama dengan VERSION di myosa.py
        run: |
          V=$(python3 -c 'import re;print(re.search(r"^VERSION = \"([^\"]+)\"", open("myosa.py").read(), re.M).group(1))')
          TAG="${GITHUB_REF_NAME#v}"
          echo "myosa.py=$V tag=$TAG"
          test "$V" = "$TAG"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
